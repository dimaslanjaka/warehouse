name: Build Release

on:
  push:
    paths-ignore:
      - '**/*.tgz'
      - '**/*.gz'
      - '**/*.tar.gz'
      - '**/dist/**'
      - '**/release/**'
      - '**/releases/**'
      - '**/_auto*/**'
      - '**/.husky/**'
      - '**/garbage-collector/**'
      - '**/codeql/**'
      - .github/workflows/tester.yml
      - '**/*.log'
      - '**/*.txt'
      - '**/*.zip'
      - '**/test*'
      - '**/docs/**'
      - '**/*.{spec,test}.{js,ts,cjs,mjs}'
  workflow_dispatch: {}

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build-release:
    name: build release
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NODE_OPTIONS: --max_old_space_size=8192
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      YARN_ENABLE_GLOBAL_CACHE: false
      YARN_CHECKSUM_BEHAVIOR: update
      YARN_CACHE_FOLDER: ${{ github.workspace }}/tmp/yarn-cache
      CI_NODE_VERSION: 24.16.0
      PIP_LOCAL_CACHE_DIR: ${{ github.workspace }}/tmp/pip
      NUITKA_CACHE_DIR: ${{ github.workspace }}/tmp/nuitka-cache
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.CI_NODE_VERSION }}

      - name: 💾 Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            yarn.lock
          key: ${{ runner.os }}-yarn-cache
          restore-keys: ${{ runner.os }}-yarn-cache

      - name: 📥 Install Dependencies
        shell: bash
        run: touch yarn.lock && yarn install

      - name: 🔨 Build project
        shell: bash
        run: yarn run build

      - name: 🎁 Pack project
        shell: bash
        run: yarn run pack

      - name: 🕵️‍♂️ Check for changes in build artifacts
        id: changes
        shell: bash
        run: |
          PATHS=( ':(glob)release*/*.tgz' )
          TRACKED=$(git diff --name-only HEAD -- "${PATHS[@]}" || true)
          UNTRACKED=$(git ls-files --others --exclude-standard -- "${PATHS[@]}" || true)
          FILES=$(printf '%s\n%s\n' "$TRACKED" "$UNTRACKED" | sed '/^$/d' | sort -u)
          if [ -n "$FILES" ]; then
            echo "Found artifact changes"
          else
            echo "No artifact changes detected"
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 👤 Configure git user/email
        if: steps.changes.outputs.files_changed == 'true'
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global url.\"https://x-access-token:${{ env.ACCESS_TOKEN }}@github.com/\".insteadOf \"https://github.com/\"

      - name: ➕ Add build files to git
        if: steps.changes.outputs.files_changed == 'true'
        continue-on-error: true
        run: git add -- release*/ || true

      - name: ⬇️ Pull latest before push
        if: steps.changes.outputs.files_changed == 'true'
        run: git pull -X theirs

      - name: 🚀 Push changes to remote
        if: steps.changes.outputs.files_changed == 'true'
        shell: bash
        run: |
          if [ $(git diff --cached --name-only | wc -l) -gt "0" ]; then
            echo "Staged files and their sizes:"
            for file in $(git diff --cached --name-only); do
              if [ -f "$file" ]; then
                size_bytes=$(stat -c%s "$file")
                size_mb=$((size_bytes / 1024 / 1024))
                echo "${size_mb}MB $file"
                if [ "$size_mb" -gt 30 ]; then
                  echo "Error: $file exceeds 30MB ($size_mb MB). Aborting push."
                  tar -tzvf "$file"
                  exit 1
                fi
              fi
            done
            git commit -m "chore: update build from ${{ github.event.head_commit.url || 'workflow' }}" \
                       -m "commit hash: ${{ github.sha }}" \
                       -m "runner: ${{ github.run_id }}"
            git push
          fi
